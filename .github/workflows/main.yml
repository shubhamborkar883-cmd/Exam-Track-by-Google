name: Government Exam Alerts Bot

on:
  schedule:
    # Runs every day at 8:00 AM UTC (1:30 PM IST)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # This allows you to manually trigger it via the Actions button

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install feedparser; fi

    - name: Execute Python script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python exam_bot.py
      
